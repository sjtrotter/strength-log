name: Publish to Play internal testing

# Manually triggered: publishing is a deliberate act, never a side effect of a
# merge. Play does not accept debug-signed builds on any track — this ships
# release-signed bundles to the internal testing tracks, which are the "builds
# for the inner circle" mechanism Play actually provides. Phone and Wear go in
# SEPARATE uploads: since March 2023 Wear OS artifacts live on their own
# dedicated form-factor track, not inside the mobile release.
#
# Rerun policy: never re-run a dispatch whose upload may have reached Play —
# run numbers (and so version codes) don't change on re-run, and Play rejects
# a code it has already seen. Dispatch a fresh run instead.
#
# Keyless auth uses Workload Identity Federation, only from main of this repo.
# Repo variables PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT configure it.
# Secrets and variables required (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64      base64 of the upload keystore (.jks) — the
#                               keystore itself never enters the repo
#   UPLOAD_STORE_PASSWORD
#   UPLOAD_KEY_ALIAS
#   UPLOAD_KEY_PASSWORD
#   PLAY_WIF_PROVIDER          full provider resource name (variable)
#   PLAY_SERVICE_ACCOUNT       service-account email (variable, docs/RELEASE.md §5.8)
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Human version (defaults to 0.1.<run>)
        required: false
      wearTrack:
        description: Wear form-factor track id (confirm against the API's track list on first use)
        required: false
        default: "wear:internal"

concurrency:
  group: publish-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse to run without secrets or variables
        env:
          WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ok=1
          for pair in "UPLOAD_KEYSTORE_BASE64:$KS" "UPLOAD_STORE_PASSWORD:$SP" "UPLOAD_KEY_ALIAS:$KA" "UPLOAD_KEY_PASSWORD:$KP"; do
            [ -n "${pair#*:}" ] || { echo "::error::${pair%%:*} secret is missing — see docs/RELEASE.md §6"; ok=0; }
          done
          for pair in "PLAY_WIF_PROVIDER:$WIF_PROVIDER" "PLAY_SERVICE_ACCOUNT:$SERVICE_ACCOUNT"; do
            [ -n "${pair#*:}" ] || { echo "::error::${pair%%:*} variable is missing; see docs/RELEASE.md §6"; ok=0; }
          done
          [ "$ok" = 1 ] || exit 1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Materialize the upload keystore (runner-local, never the workspace)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundles (phone even code, wear odd)
        env:
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          # User input reaches the shell only through the environment — never
          # interpolated into shell source.
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
        run: |
          # +10 clears the hand-uploaded codes (1, 4) and the burned 2 —
          # Play remembers every code ever uploaded, forever.
          BASE=$(( ${{ github.run_number }} * 2 + 10 ))
          NAME="$INPUT_VERSION_NAME"
          [ -n "$NAME" ] || NAME="0.1.${{ github.run_number }}"
          ./gradlew :app:bundleRelease :wear:bundleRelease \
            -PSTRENGTHLOG_VERSION_CODE="$BASE" \
            -PSTRENGTHLOG_VERSION_NAME="$NAME"

      - name: Upload the phone bundle to the internal track
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: cloud.trotter.log.strength
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Upload the wear bundle to its form-factor track
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: cloud.trotter.log.strength
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          track: ${{ inputs.wearTrack }}
          status: completed

      - name: Scrub the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
