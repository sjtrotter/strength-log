name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the branch's running build; main's post-merge runs
# are never cancelled (each validates a distinct merged commit).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build
        # Backstop for a hang the test task's own timeout can't interrupt (#310).
        timeout-minutes: 30

      # The failure log only says "AssertionError at Foo.kt:42"; the XML has
      # the message and the stack, which is what a fix actually needs.
      - name: Keep unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

      # Room writes each version's schema JSON during the build. A migration
      # PR must commit its new file, and this step hands it over when it didn't.
      - name: Check Room schemas are committed
        run: |
          git add -N data/schemas
          git diff --exit-code --stat -- data/schemas

      - name: Keep generated Room schemas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: data/schemas
          if-no-files-found: ignore

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install screenshot checker dependencies
        run: pip install --quiet pillow==11.3.0

      - name: Render store screenshots
        run: ./gradlew :app:testDebugUnitTest --tests '*StoreScreenshotsTest' :wear:testDebugUnitTest --tests '*StoreScreenshotsTest' -PstoreShots=true
        timeout-minutes: 20

      - name: Check store screenshots
        run: python scripts/check_store_shots.py app/build/outputs/store wear/build/outputs/store

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            app/build/outputs/store/
            wear/build/outputs/store/
          if-no-files-found: error

      - name: Compile instrumented tests
        run: ./gradlew :data:assembleDebugAndroidTest :transfer:assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew :data:connectedDebugAndroidTest :transfer:connectedDebugAndroidTest
