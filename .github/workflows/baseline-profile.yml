name: Baseline profile

# Generating the profile boots an emulator, installs a non-minified release
# build and drives the app through it — minutes of work for a file that only
# moves when the scroll path does. So it runs when someone asks for it, not on
# every pull request.
#
# The run leaves the profile as an artifact; download it and commit it to
# app/src/release/generated/baselineProfiles/ (see docs/RELEASE.md).
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The AOSP image, not google_apis: profile collection needs `adb root`,
      # which the Play-services images don't allow.
      - name: Generate the profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: ./gradlew :app:generateReleaseBaselineProfile -PbaselineProfileGeneration=true

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/
          if-no-files-found: error
