name: Screen catalog

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to catalog (a round's pinned build)
        required: true
        type: string
  pull_request:
    paths:
      - 'playtest/catalog/**'
      - 'app/src/test/kotlin/cloud/trotter/log/strength/playtest/**'
      - 'scripts/catalog*.sh'
      - '.github/workflows/catalog.yml'

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}-${{ inputs.ref || 'pr' }}
  cancel-in-progress: true

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.pick.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check catalog merger
        run: bash scripts/catalog-test.sh
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          scripts=$(ls playtest/catalog/*.json | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"

  walk:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.pick.outputs.scripts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Replay
        id: replay
        continue-on-error: true
        env:
          PLAYTEST_SCRIPT: ${{ matrix.script }}
          PLAYTEST_CAPTURE_FROM: '0'
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'cloud.trotter.log.strength.playtest.PlaytestReplayTest'
          -Pplaytest="$GITHUB_WORKSPACE/$PLAYTEST_SCRIPT"
          -PplaytestCaptureFrom="$PLAYTEST_CAPTURE_FROM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-walk-${{ strategy.job-index }}
          path: app/build/outputs/playtest/
          if-no-files-found: error
          retention-days: 14
      - name: Report
        if: always()
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          set -euo pipefail
          cat app/build/outputs/playtest/summary.json
          test "$REPLAY_OUTCOME" = success

  merge:
    needs: [pick, walk]
    if: always() && needs.pick.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-walk-*
          path: walks/
      - name: Merge listings
        run: |
          set -euo pipefail
          bash scripts/catalog.sh walks "$(git rev-parse HEAD)" > catalog.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog
          path: catalog.md
          if-no-files-found: error
          retention-days: 30
