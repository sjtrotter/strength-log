name: Play store listing

# Manually triggered. "inspect" prints what the Console holds (listing text,
# image ids, tracks) and changes nothing; "upload" replaces the en-US listing
# text and images with what is under play/listing/ and commits the edit.
# Keyless auth uses Workload Identity Federation, only from main of this repo.
# Repo variables PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT configure it.
# Needs "View app information (read-only)" for inspect and "Manage store presence" for upload.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect or upload
        required: true
        default: inspect
        type: choice
        options: [inspect, upload]

jobs:
  listing:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client==2.154.0 google-auth==2.37.0
      - run: python scripts/play_listing.py "$MODE"
        env:
          MODE: ${{ inputs.mode }}
