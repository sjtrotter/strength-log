name: Release to Play internal testing

# Pushing a version tag publishes release-signed phone and Wear bundles;
# merges never publish. Version names and codes come from the tag:
# major*100000 + minor*1000 + patch*10, phone +0, watch +1
# (wear/build.gradle.kts). Each form factor has its own internal track.
# Tags must only go up: devices never update to a lower code. A run that
# failed before either upload can be re-run. Once an upload has reached
# Play, its version code is used; fix it with the next patch tag.
# Re-running only a failed release job does not repeat the uploads.
#
# Keyless auth accepts only main or v* tags of this repo.
# Repo variables PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT configure it.
# Secrets and variables required (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64      base64 of the upload keystore (.jks) — the
#                               keystore itself never enters the repo
#   UPLOAD_STORE_PASSWORD
#   UPLOAD_KEY_ALIAS
#   UPLOAD_KEY_PASSWORD
#   PLAY_WIF_PROVIDER          full provider resource name (variable)
#   PLAY_SERVICE_ACCOUNT       service-account email (variable, docs/RELEASE.md §5.8)
on:
  push:
    tags: ['v*']

concurrency:
  group: publish-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    outputs:
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Expected vMAJOR.MINOR.PATCH with non-negative integers and no leading zeros."
            exit 1
          fi
          if (( ${#minor} > 2 || ${#patch} > 2 )); then
            echo "::error::Minor and patch must each be at most 99."
            exit 1
          fi
          if (( ${#major} > 5 )); then
            echo "::error::Phone version code must not exceed 2099999990."
            exit 1
          fi
          code=$(( major*100000 + minor*1000 + patch*10 ))
          if (( code < 1000 )); then
            echo "::error::The first supported tag is v0.1.0; Play already holds lower codes."
            exit 1
          fi
          if (( code > 2099999990 )); then
            echo "::error::Phone version code must not exceed 2099999990."
            exit 1
          fi
          prerelease=false
          (( major == 0 )) && prerelease=true
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version ${TAG#v}: phone $code, watch $(( code + 1 )), prerelease=$prerelease"

      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi

      - name: Refuse to run without secrets or variables
        env:
          WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ok=1
          for pair in "UPLOAD_KEYSTORE_BASE64:$KS" "UPLOAD_STORE_PASSWORD:$SP" "UPLOAD_KEY_ALIAS:$KA" "UPLOAD_KEY_PASSWORD:$KP"; do
            [ -n "${pair#*:}" ] || { echo "::error::${pair%%:*} secret is missing — see docs/RELEASE.md §6"; ok=0; }
          done
          for pair in "PLAY_WIF_PROVIDER:$WIF_PROVIDER" "PLAY_SERVICE_ACCOUNT:$SERVICE_ACCOUNT"; do
            [ -n "${pair#*:}" ] || { echo "::error::${pair%%:*} variable is missing; see docs/RELEASE.md §6"; ok=0; }
          done
          [ "$ok" = 1 ] || exit 1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Materialize the upload keystore (runner-local, never the workspace)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundles (phone even code, wear odd)
        env:
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew :app:bundleRelease :wear:bundleRelease \
            -PSTRENGTHLOG_VERSION_CODE="$CODE" \
            -PSTRENGTHLOG_VERSION_NAME="$NAME"

      - name: Upload the phone bundle to the internal track
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: cloud.trotter.log.strength
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Upload the wear bundle to its form-factor track
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: cloud.trotter.log.strength
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          track: wear:internal
          status: completed

      - name: Scrub the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  # Keep release write permission out of the job that holds signing material.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.publish.outputs.name }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=$PRERELEASE
          else
            args=()
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --title "$NAME" "${args[@]}"
          fi
