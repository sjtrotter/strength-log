name: Publish to Play internal testing

# Manually triggered: publishing is a deliberate act, never a side effect of a
# merge. Play does not accept debug-signed builds on any track — this ships
# release-signed bundles (phone + wear) to the INTERNAL track, which is the
# "debug builds for the inner circle" mechanism Play actually provides.
#
# Secrets required (repo Settings → Secrets and variables → Actions):
#   PLAY_SERVICE_ACCOUNT_JSON   service-account key with Play "Release manager"
#                               access to the app (docs/RELEASE.md §Play)
#   UPLOAD_KEYSTORE_BASE64      base64 of the upload keystore (.jks) — the
#                               keystore itself never enters the repo
#   UPLOAD_STORE_PASSWORD
#   UPLOAD_KEY_ALIAS
#   UPLOAD_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Human version (defaults to 0.1.<run>)
        required: false

concurrency:
  group: publish-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run without secrets
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [ -n "$SA" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing — see docs/RELEASE.md"; exit 1; }
          [ -n "$KS" ] || { echo "::error::UPLOAD_KEYSTORE_BASE64 secret is missing — see docs/RELEASE.md"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize the upload keystore (runner-local, never the workspace)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundles (phone even code, wear odd)
        env:
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_STRENGTHLOG_RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          BASE=$(( ${{ github.run_number }} * 2 ))
          NAME="${{ inputs.versionName }}"
          [ -n "$NAME" ] || NAME="0.1.${{ github.run_number }}"
          ./gradlew :app:bundleRelease :wear:bundleRelease \
            -PSTRENGTHLOG_VERSION_CODE="$BASE" \
            -PSTRENGTHLOG_VERSION_NAME="$NAME"

      - name: Upload both form factors to the internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.trotter.log.strength
          releaseFiles: |
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
          track: internal
          status: completed

      - name: Scrub the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
