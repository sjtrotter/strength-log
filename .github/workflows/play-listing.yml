name: Play store listing

# Manually triggered. "inspect" prints what the Console holds (listing text,
# image ids, tracks) and changes nothing; "upload" replaces the en-US listing
# text and images with what is under play/listing/ and commits the edit.
# "screenshots" replaces phone and Wear screenshots from a release's zip.
# Keyless auth uses Workload Identity Federation, only from main of this repo.
# Repo variables PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT configure it.
# Needs "View app information (read-only)" for inspect and "Manage store presence" for uploads.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect, upload or screenshots
        required: true
        default: inspect
        type: choice
        options: [inspect, upload, screenshots]
      tag:
        description: Release tag whose screenshots to upload (screenshots mode)
        required: false
        type: string

jobs:
  listing:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client==2.154.0 google-auth==2.37.0
      - name: Download release screenshots
        if: inputs.mode == 'screenshots'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected vMAJOR.MINOR.PATCH with non-negative integers and no leading zeros."
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern store-screenshots.zip --dir "$RUNNER_TEMP"
          unzip "$RUNNER_TEMP/store-screenshots.zip" -d "$RUNNER_TEMP/store"
      - run: |
          if [[ "$MODE" == screenshots ]]; then
            python scripts/play_listing.py "$MODE" --images "$RUNNER_TEMP/store"
          else
            python scripts/play_listing.py "$MODE"
          fi
        env:
          MODE: ${{ inputs.mode }}
