name: Play store listing

# Manually triggered. "inspect" prints what the Console holds (listing text,
# image ids, tracks) and changes nothing; "upload" replaces the en-US listing
# text and images with what is under play/listing/ and commits the edit.
# Needs the service account to hold "Manage store presence" for the app.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect or upload
        required: true
        default: inspect
        type: choice
        options: [inspect, upload]

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client==2.154.0 google-auth==2.37.0
      - run: python scripts/play_listing.py "${{ inputs.mode }}"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
