name: Playtest

on:
  workflow_dispatch:
    inputs:
      script:
        description: Path to the script JSON
        required: true
        type: string
        default: playtest/script.json
      capture_from:
        description: First step index to capture (earlier steps replay silently)
        required: false
        type: string
        default: '0'
  # A harness change replays every pilot. An app change replays the core pilots,
  # which walk setup, a workout, History and Plans, so a screen change that
  # breaks a script fails its own PR instead of the next harness PR.
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'data/src/main/**'
      - 'domain/src/main/**'
      - 'transfer/src/main/**'
      - 'app/src/test/kotlin/cloud/trotter/log/strength/playtest/**'
      - 'playtest/pilot/**'
      - 'scripts/**'
      - '.github/workflows/playtest.yml'

concurrency:
  group: playtest-${{ github.ref }}-${{ inputs.script || 'pilots' }}
  cancel-in-progress: true

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scripts: ${{ steps.pick.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SCRIPT: ${{ inputs.script }}
        run: |
          core='["playtest/pilot/wizard-to-today.json","playtest/pilot/rest-timer-advance.json","playtest/pilot/history-day-start.json","playtest/pilot/dialog-text-field.json","playtest/pilot/ladder-day.json","playtest/pilot/sprint-beep-timer.json"]'
          all='["playtest/pilot/sprint-to-today.json","playtest/pilot/both-sprint-to-today.json","playtest/pilot/both-to-today.json","playtest/pilot/zero-step-launch.json","playtest/pilot/wizard-dialog-capture.json","playtest/pilot/wizard-to-today.json","playtest/pilot/run-to-today.json","playtest/pilot/rest-timer-advance.json","playtest/pilot/set-card-gate.json","playtest/pilot/day-crossing.json","playtest/pilot/scroll-below-fold.json","playtest/pilot/sheet-number-ime.json","playtest/pilot/dialog-text-field.json","playtest/pilot/history-day-start.json","playtest/pilot/zero-size-tap.json","playtest/pilot/dropdown-tap.json","playtest/pilot/advance-tap.json","playtest/pilot/page-transition-settle.json","playtest/pilot/compact-capture.json","playtest/pilot/optional-step.json","playtest/pilot/sprint-beep-timer.json","playtest/pilot/sprint-typed-time.json","playtest/pilot/ladder-day.json","playtest/pilot/run-typed-distance.json","playtest/pilot/cardio-log-past.json","playtest/pilot/past-session-start-time.json","playtest/pilot/timed-rep-count.json","playtest/pilot/test-date-picker.json","playtest/pilot/balance-day.json","playtest/pilot/cardio-edit-survives-back.json","playtest/pilot/plank-hold-timer.json"]'
          retry_test=false
          if [ -z "$PR" ]; then
            scripts=$(jq -nc --arg s "$SCRIPT" '[$s]')
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')
            if grep -qE '^(app/src/test/kotlin/cloud/trotter/log/strength/playtest/|playtest/pilot/|\.github/workflows/playtest\.yml$)' <<<"$files"; then
              scripts=$all
            elif grep -qE '^(app/src/main/|data/src/main/|domain/src/main/|transfer/src/main/)' <<<"$files"; then
              scripts=$core
            else
              scripts='[]'
            fi
            if grep -qE '^(scripts/playtest\.sh$|scripts/gh-retry[^/]*\.sh$|\.github/workflows/playtest\.yml$)' <<<"$files"; then
              retry_test=true
            fi
          fi
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "retry_test=$retry_test" >> "$GITHUB_OUTPUT"

      - name: Check GitHub retries
        if: steps.pick.outputs.retry_test == 'true'
        run: bash scripts/gh-retry-test.sh

  replay:
    needs: pick
    if: needs.pick.outputs.scripts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.pick.outputs.scripts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Replay
        id: replay
        continue-on-error: true
        env:
          PLAYTEST_SCRIPT: ${{ matrix.script }}
          PLAYTEST_CAPTURE_FROM: ${{ inputs.capture_from || '0' }}
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'cloud.trotter.log.strength.playtest.PlaytestReplayTest'
          -Pplaytest="$GITHUB_WORKSPACE/$PLAYTEST_SCRIPT"
          -PplaytestCaptureFrom="$PLAYTEST_CAPTURE_FROM"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-${{ github.run_id }}-${{ strategy.job-index }}
          path: app/build/outputs/playtest/
          if-no-files-found: error
          retention-days: 14

      - name: Report
        if: always()
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          PILOT: ${{ matrix.script }}
        run: |
          cat app/build/outputs/playtest/summary.json
          test "$REPLAY_OUTCOME" = success
          case "$PILOT" in
            playtest/pilot/optional-step.json)
              jq -e '.optional_skipped == [0]' app/build/outputs/playtest/summary.json
              ;;
            playtest/pilot/ladder-day.json)
              jq -e '.cardioSessions | length == 1 and
                (.[0] | .seconds == 1500 and .stepsCompleted == 20 and
                  ([.sets[].elapsedSeconds] | add) == 1500)' app/build/outputs/playtest/backup.json
              ;;
          esac
